<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PI P-621.1CD 位移台控制台</title>
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="bar">
  <h1>PI P-621.1CD 位移台控制台</h1>
  <div class="pills">
    <span class="pill" id="pill-link">界面连接中…</span>
    <span class="pill" id="pill-dev">设备…</span>
    <span class="pill" id="pill-servo">伺服…</span>
    <span class="pill" id="pill-scan">空闲</span>
  </div>
</header>

<main>

  <section class="card">
    <h2>位置</h2>
    <div class="readout">
      <span id="pos">—</span><small>µm</small>
    </div>
    <dl class="kv">
      <dt>目标</dt><dd id="target">—</dd>
      <dt>到位</dt><dd id="ontarget">—</dd>
      <dt>速度</dt><dd id="velocity">—</dd>
      <dt>状态</dt><dd id="errcode">—</dd>
    </dl>
    <p class="hint">行程 <b id="limits">—</b> µm（由控制器读取）
      <button id="btn-connect" class="ghost">重连</button></p>
  </section>

  <section class="card">
    <h2>手动控制</h2>
    <label>目标位置 (µm)
      <input id="move-target" type="number" step="0.001">
    </label>
    <button id="btn-move" class="primary">移动到</button>

    <label>点动 (µm)</label>
    <div class="row tight">
      <button data-jog="-10">−10</button>
      <button data-jog="-1">−1</button>
      <button data-jog="-0.1">−0.1</button>
      <button data-jog="0.1">+0.1</button>
      <button data-jog="1">+1</button>
      <button data-jog="10">+10</button>
    </div>

    <label>速度 (µm/s)
      <input id="vel" type="number" min="1" step="100">
    </label>
    <button id="btn-vel">设定速度</button>

    <label>伺服</label>
    <div class="row tight">
      <button id="btn-servo-on" class="primary">开启伺服</button>
      <button id="btn-release" class="danger" title="关伺服卸力，台子会回弹。异常振动时用（手册建议）。会同时中止扫描。">释放</button>
    </div>

    <label>安全</label>
    <div class="row tight">
      <button id="btn-stop" class="warn" title="STP：立刻停止运动，保持伺服与当前位置。扫描中会同时中止扫描。">停止</button>
      <button id="btn-estop" class="danger" title="丢弃排队命令 + STP，并中止扫描。">急停</button>
    </div>
  </section>

  <section class="card span2">
    <h2>扫描</h2>
    <div class="form">
      <label>名称<input id="scan-name" placeholder="可留空"></label>
      <label>起点 (µm)<input id="scan-start" type="number" step="0.1"></label>
      <label>终点 (µm)<input id="scan-stop" type="number" step="0.1"></label>
      <label>点数<input id="scan-count" type="number" min="2" step="1"></label>
      <label>稳定延时 (ms)<input id="scan-settle" type="number" min="0" step="10"></label>
      <button id="btn-scan-start" class="primary">开始扫描</button>
    </div>
    <div class="progress">
      <div class="bar"><div id="scan-bar"></div></div>
      <div class="ptext"><span id="scan-progress">未开始</span><span id="scan-msg"></span></div>
    </div>
    <p class="hint" id="scan-hint">单向逼近：从起点到终点单调推进，每点从同一侧逼近；起点前会先退让一段再逼近首点。</p>
    <div class="row tight">
      <button id="btn-pause">暂停</button>
      <button id="btn-resume">继续</button>
      <button id="btn-abort">中止</button>
    </div>
  </section>

  <section class="card span2">
    <h2>点位 <span class="sub" id="chart-title">未载入</span></h2>
    <div id="chart" class="chart"></div>
    <div class="tablewrap">
      <table id="points">
        <thead><tr>
          <th>#</th><th>目标 (µm)</th><th>实际 (µm)</th><th>偏差 (nm)</th>
          <th>到位</th><th>耗时 (ms)</th><th>图像</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card span2">
    <h2>历史扫描 <button id="btn-refresh" class="ghost">刷新</button></h2>
    <div class="tablewrap">
      <table id="history">
        <thead><tr>
          <th>#</th><th>名称</th><th>范围 (µm)</th><th>点数</th>
          <th>已采</th><th>状态</th><th>创建时间</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</main>

<div id="toast"></div>
<div id="lightbox" hidden><img id="lightbox-img" alt=""></div>

<script src="/static/vendor/uPlot.iife.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
